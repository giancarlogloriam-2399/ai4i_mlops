[project]
name = "ai4i-mlops"
version = "0.1.0"
description = "Mantenimiento predictivo AI4I 2020: modelo de ML de punta a punta (datos, API, interfaz, Docker y CI/CD)"
readme = "README.md"
authors = [
    { name = "giancarlogloriam-2399", email = "giancarlo.gloriam@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "gradio>=6.30.0",
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
preparar-datos = "ai4i_mlops.data:main"
entrenar = "ai4i_mlops.train:main"
predecir = "ai4i_mlops.predict:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
