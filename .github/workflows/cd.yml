name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  desplegar:
    name: Desplegar en Render
    # Solo se despliega si el CI terminó en verde
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # Las URLs de los deploy hooks están en GitHub > Settings > Secrets (nunca en el código)
      - name: Desplegar la API
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_API }}
        run: curl -fsS -X POST "$HOOK"

      - name: Desplegar la interfaz (Gradio)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_UI }}
        run: curl -fsS -X POST "$HOOK"
